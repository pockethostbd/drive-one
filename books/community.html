<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>BookReader Community</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--panel2:#1a2940;--border:#2b3b54;--text:#f4f7fc;--muted:#a8b7cc;--accent:#f5b83d;--accentText:#172033;--danger:#ff9a9a;--shadow:0 12px 32px #0002}
body.light{--bg:#f2f5fa;--panel:#fff;--panel2:#f0f4f9;--border:#dbe3ee;--text:#172033;--muted:#607087;--accent:#e9a51f;--accentText:#172033;--shadow:0 8px 24px #26365010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;min-height:100vh;transition:background .2s,color .2s;padding-bottom:70px}
a{color:inherit}.app{max-width:1120px;margin:auto}.topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--accent);color:#172033;border-radius:14px;font-size:22px}.logo img{width:100%;height:100%;object-fit:contain;border-radius:inherit}.brand strong{display:block;font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px}
.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,.btn{font:inherit;font-size:13px;font-weight:750;border:1px solid transparent;border-radius:11px;padding:10px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--accent);color:var(--accentText)}.secondary,.btn-secondary{background:var(--panel2);color:var(--text);border-color:var(--border)}.danger{background:transparent;color:var(--danger);border-color:#7d3545}.tiny{padding:7px 9px;font-size:12px}
.layout{padding:16px;max-width:760px;margin:auto}.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}h1,h2,h3,p{margin-top:0}h1{font-size:22px;margin-bottom:6px}h2{font-size:17px;margin-bottom:10px}h3{font-size:16px;margin-bottom:7px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.navitem{width:100%;justify-content:flex-start;background:transparent;color:var(--text);border-color:transparent;margin:2px 0}.navitem:hover,.navitem.active{background:var(--panel2);border-color:var(--border)}
input,textarea{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:12px;padding:12px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--accent)}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}textarea{min-height:85px;resize:vertical}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none!important}.status{font-size:13px;line-height:1.6;margin:10px 0 0;white-space:pre-wrap}.error{color:var(--danger)}.ok{color:#4bd59b}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:5px 9px;font-size:11px;color:var(--muted)}.profileline{display:flex;gap:11px;align-items:center}.avatar{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#f5b83d,#e87952);color:#172033;font-weight:900;font-size:17px;overflow:hidden}
.feed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 10px}.post{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow);overflow-wrap:anywhere}.posttop{display:flex;align-items:center;gap:10px}.postwho{flex:1;min-width:0}.postwho strong{display:block;font-size:15px}.postwho small{color:var(--muted);font-size:11px}.post-desc{white-space:pre-wrap;font-size:14px;line-height:1.65;color:var(--text);margin:12px 0}.book-desc-box{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px;margin:10px 0;font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:var(--text)}
.post-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}.empty{text-align:center;color:var(--muted);padding:28px 12px}.authwrap{max-width:480px;margin:35px auto;padding:0 14px}
.app-bottom-nav{position:fixed;z-index:30;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--border)}
.app-bottom-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:7px 4px;background:transparent;color:var(--muted);border:1px solid transparent;font-size:11px;border-radius:10px}
.app-bottom-nav button.active{background:var(--panel2);color:var(--accent);border-color:var(--border)}
.verified-badge{display:inline-flex;vertical-align:middle;width:16px;height:16px;margin-left:4px}
.verified-badge svg{width:100%;height:100%;display:block}
.book-title-link{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #eab83c;background:linear-gradient(135deg,#fff4c7,#f5b83d);color:#182238;border-radius:14px;padding:14px 15px;margin:10px 0;text-decoration:none;font-weight:850;box-shadow:0 0 18px #f5b83d45}
.book-title-link .linkhint{display:flex;align-items:center;gap:5px;font-size:11px;white-space:nowrap}
.post-mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.svg-icon { width: 16px; height: 16px; fill: currentColor; display: inline-block; vertical-align: middle; }
.page-view.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <a href="./index.html" class="brand"><div class="logo"><img src="https://pockethostbd.github.io/drive-one/picture/BookReader-logo.png" alt="BookReader logo"></div><div><strong>BookReader</strong><small data-i18n="tagline">বই শেয়ার করুন · পাঠকদের সঙ্গে যুক্ত থাকুন</small></div></a>
  <div class="tools">
    <button class="secondary" id="langBtn">English</button>
    <button class="secondary" id="themeBtn">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zM7.05 18.36l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.02-.39-1.41 0zm12.37-12.37l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0z"/></svg> Light
    </button>
  </div>
</header>

<!-- Auth Section -->
<div id="authArea" class="authwrap">
  <section class="panel">
    <h1 data-i18n="welcome">কমিউনিটিতে যোগ দিন</h1><p class="muted" data-i18n="authDesc">অ্যাকাউন্ট তৈরি করুন এবং আপনার পছন্দের বই শেয়ার করুন।</p>
    <form id="authForm">
      <label data-i18n="emailLabel" for="email">ইমেইল</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com">
      <label data-i18n="passwordLabel" for="password">পাসওয়ার্ড</label><input id="password" type="password" required minlength="6">
      <div id="confirmPasswordWrap" class="hidden"><label data-i18n="confirmPasswordLabel" for="confirmPassword">পাসওয়ার্ড নিশ্চিত করুন</label><input id="confirmPassword" type="password" minlength="6"></div>
      <div class="row" style="margin-top:14px"><button class="primary" type="submit" id="loginBtn" data-i18n="login">লগইন</button><button class="secondary" type="button" id="signupBtn" data-i18n="signup">অ্যাকাউন্ট তৈরি</button></div>
    </form><p id="authStatus" class="status" role="status"></p>
  </section>
</div>

<!-- Main App Section -->
<div id="communityArea" class="layout hidden">
  
  <!-- 1. FEED VIEW -->
  <div id="feedView" class="page-view">
    <section class="panel" id="composer">
      <h2><svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg> <span data-i18n="createPost">নতুন পোস্ট</span></h2>
      <div class="post-mode-switch">
        <button class="primary" type="button" id="textPostMode"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4-3H3c-.55 0-1 .45-1 1v14l4-4h11c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1z"/></svg> <span data-i18n="textPostMode">Only Post</span></button>
        <button class="secondary" type="button" id="bookPostMode"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg> <span data-i18n="bookPostMode">Book Post</span></button>
      </div>
      <form id="postForm">
        <label id="postTextLabel" data-i18n="postTextLabel" for="postText">আপনার মতামত অথবা আজকে কি ভাবছেন</label>
        <textarea id="postText" maxlength="5000" placeholder="আজকে কি ভাবছেন, লিখুন…"></textarea>
        
        <div id="bookFields" class="hidden">
          <label data-i18n="bookName" for="bookName">Book Name</label>
          <input id="bookName" maxlength="160" placeholder="বইয়ের নাম">
          <label data-i18n="bookUrl" for="bookUrl">Book Link</label>
          <input id="bookUrl" type="url" maxlength="2048" placeholder="https://drive.google.com/...">
          <label data-i18n="bookDesc" for="bookDesc">Book Description</label>
          <textarea id="bookDesc" maxlength="3000" placeholder="বইটির বিস্তারিত তথ্য বা ডেসক্রিপশন লিখুন…"></textarea>
        </div>

        <div class="row" style="margin-top:10px;">
          <button class="primary" type="submit" id="publishBtn"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg> <span data-i18n="publish">পোস্ট করুন</span></button>
          <button class="secondary hidden" id="cancelEditBtn" type="button" data-i18n="cancelEdit">বাতিল</button>
        </div>
      </form><p id="postStatus" class="status"></p>
    </section>

    <div class="feed-head">
      <div><h2 style="margin:0" data-i18n="feedTitle">📚 কমিউনিটির পোস্ট</h2></div>
      <button class="secondary tiny" id="refreshBtn"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg> <span data-i18n="refresh">রিফ্রেশ</span></button>
    </div>
    <div id="feedStatus" class="status"></div>
    <div id="feed"><div class="empty" data-i18n="loading">পোস্ট লোড হচ্ছে…</div></div>
  </div>

  <!-- 2. PROFILE VIEW -->
  <div id="profileView" class="page-view hidden">
    <section class="panel">
      <h2><svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg> <span data-i18n="profileHeading">আমার প্রোফাইল সম্পাদনা</span></h2>
      <div class="profileline" style="margin-bottom:15px;">
        <div class="avatar" id="myAvatarIcon"><svg class="svg-icon" style="width:24px;height:24px" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
        <div><strong id="myProfileName">Reader</strong><div class="muted" id="myProfileEmail">email@example.com</div></div>
      </div>
      <form id="profileForm">
        <label data-i18n="displayName" for="displayName">নাম (Display Name)</label>
        <input id="displayName" maxlength="60" required placeholder="আপনার নাম লিখুন">
        <label data-i18n="bioLabel" for="profileBio">বায়ো / পরিচিতি</label>
        <textarea id="profileBio" maxlength="300" placeholder="নিজের সম্পর্কে লিখুন…"></textarea>
        <button class="primary" type="submit" style="margin-top:12px; width:100%;" data-i18n="saveProfile">প্রোফাইল সংরক্ষণ করুন</button>
      </form>
      <p id="profileStatus" class="status"></p>
    </section>
    <section class="panel">
      <button class="danger" type="button" id="logoutBtn" style="width:100%;">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg> <span data-i18n="logout">লগআউট</span>
      </button>
    </section>
  </div>

  <!-- 3. SETTINGS VIEW -->
  <div id="settingsView" class="page-view hidden">
    <section class="panel">
      <h2><svg class="svg-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg> <span data-i18n="settingsTitle">সেটিংস</span></h2>
      <p class="muted" data-i18n="settingsNote">অ্যাপের সাধারণ কনফিগারেশন পরিবর্তন করুন।</p>
    </section>
  </div>

</div>

<!-- Bottom Navigation -->
<nav class="app-bottom-nav" id="appBottomNav">
  <button type="button" class="active" id="navFeedBtn">
    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
    <span data-i18n="feedNav">ফিড</span>
  </button>
  <button type="button" id="navProfileBtn">
    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    <span data-i18n="profileNav">প্রোফাইল</span>
  </button>
  <button type="button" id="navSettingsBtn">
    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    <span data-i18n="settingsNav">সেটিং</span>
  </button>
</nav>

</div>

const $=id=>document.getElementById(id);

const words={
  bn:{tagline:"বই ভাগাভাগির পাঠক কমিউনিটি",welcome:"কমিউনিটিতে যোগ দিন",authDesc:"অ্যাকাউন্ট তৈরি করুন এবং আপনার পছন্দের বই শেয়ার করুন।",emailLabel:"ইমেইল",passwordLabel:"পাসওয়ার্ড",confirmPasswordLabel:"পাসওয়ার্ড নিশ্চিত করুন",passwordMismatch:"দুটি পাসওয়ার্ড একই নয়।",login:"লগইন",signup:"অ্যাকাউন্ট তৈরি",createAccountNow:"তথ্য দিয়ে অ্যাকাউন্ট তৈরি করুন",switchToLogin:"লগইনে ফিরে যান",logout:"লগআউট",publicCommunity:"সবার জন্য উন্মুক্ত",feedNav:"ফিড",profileNav:"প্রোফাইল",settingsNav:"সেটিং",textPostMode:"Only Post",bookPostMode:"Book Post",profileHeading:"আমার প্রোফাইল সম্পাদনা",displayName:"নাম (Display Name)",bioLabel:"বায়ো / পরিচিতি",saveProfile:"প্রোফাইল সংরক্ষণ করুন",createPost:"নতুন পোস্ট",postTextLabel:"আপনার মতামত অথবা আজকে কি ভাবছেন",bookName:"Book Name",bookDesc:"Book Description",bookUrl:"Book Link",publish:"পোস্ট করুন",cancelEdit:"বাতিল",feedTitle:"📚 কমিউনিটির পোস্ট",refresh:"রিফ্রেশ",loading:"পোস্ট লোড হচ্ছে…",noPosts:"এখনো কোনো পোস্ট নেই। প্রথম পোস্টটি আপনিই করুন!",profileSaved:"প্রোফাইল সংরক্ষিত হয়েছে।",postSaved:"পোস্ট প্রকাশিত হয়েছে।",postUpdated:"পোস্ট আপডেট হয়েছে।",edit:"এডিট",delete:"ডিলিট",openLink:"বইয়ের লিংক খুলুন",confirmDelete:"এই পোস্টটি মুছে ফেলতে চান?",network:"ইন্টারনেট সংযোগ বা Firebase সেটআপ পরীক্ষা করুন।",badUrl:"বৈধ http/https লিংক দিন।",account:"অ্যাকাউন্ট",anonymous:"পাঠক",profileMissing:"আপনার নাম লিখুন।",created:"প্রকাশিত",settingsTitle:"সেটিংস",settingsNote:"অ্যাপের সাধারণ কনফিগারেশন পরিবর্তন করুন।"},
  en:{tagline:"A reader community to share books",welcome:"Join the community",authDesc:"Create an account and share your favorite books.",emailLabel:"Email",passwordLabel:"Password",confirmPasswordLabel:"Confirm password",passwordMismatch:"Passwords do not match.",login:"Log in",signup:"Create account",createAccountNow:"Create account now",switchToLogin:"Back to login",logout:"Log out",publicCommunity:"Public Community",feedNav:"Feed",profileNav:"Profile",settingsNav:"Settings",textPostMode:"Only Post",bookPostMode:"Book Post",profileHeading:"Edit My Profile",displayName:"Display Name",bioLabel:"Bio / About",saveProfile:"Save Profile",createPost:"Create a post",postTextLabel:"Your thoughts for today",bookName:"Book Name",bookDesc:"Book Description",bookUrl:"Book Link",publish:"Publish Post",cancelEdit:"Cancel",feedTitle:"📚 Community Posts",refresh:"Refresh",loading:"Loading posts…",noPosts:"No posts yet. Be the first to share!",profileSaved:"Profile saved.",postSaved:"Post published.",postUpdated:"Post updated.",edit:"Edit",delete:"Delete",openLink:"Open Book Link",confirmDelete:"Delete this post?",network:"Check your internet connection.",badUrl:"Enter a valid URL.",account:"Account",anonymous:"Reader",profileMissing:"Enter your name.",created:"Published",settingsTitle:"Settings",settingsNote:"Change app configuration."}
};

let lang=localStorage.getItem("brCommunityLang")||"bn";
let theme=localStorage.getItem("brCommunityTheme")||"dark";
let user=null,dbFns=null,authFns=null,auth=null,app=null,db=null,editing=null,profiles={};

function tr(k){return (words[lang]||words.bn)[k]||k}
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll("[data-i18n]").forEach(el=>{const key=el.dataset.i18n;if(words[lang][key])el.textContent=words[lang][key]});$("langBtn").textContent=lang==="bn"?"English":"বাংলা"}
function applyTheme(){document.body.classList.toggle("light",theme==="light");document.querySelector('meta[name="theme-color"]').content=theme==="dark"?"#111827":"#f2f5fa"}

$("langBtn").addEventListener("click",()=>{lang=lang==="bn"?"en":"bn";localStorage.setItem("brCommunityLang",lang);applyLang();if(user)loadFeed()});
$("themeBtn").addEventListener("click",()=>{theme=theme==="dark"?"light":"dark";localStorage.setItem("brCommunityTheme",theme);applyTheme()});
applyLang();applyTheme();

function status(id,msg,type=""){const el=$(id);if(!el)return;el.textContent=msg;el.className="status "+type}
function safeUrl(raw){try{const u=new URL(raw);return ["https:","http:"].includes(u.protocol)&&!!u.hostname?u.href:""}catch{return ""}}

// Navigation Logic
function switchView(viewName){
  $("feedView").classList.add("hidden");
  $("profileView").classList.add("hidden");
  $("settingsView").classList.add("hidden");
  $("navFeedBtn").classList.remove("active");
  $("navProfileBtn").classList.remove("active");
  $("navSettingsBtn").classList.remove("active");

  if(viewName==='feed'){
    $("feedView").classList.remove("hidden");
    $("navFeedBtn").classList.add("active");
  } else if(viewName==='profile'){
    $("profileView").classList.remove("hidden");
    $("navProfileBtn").classList.add("active");
  } else if(viewName==='settings'){
    $("settingsView").classList.remove("hidden");
    $("navSettingsBtn").classList.add("active");
  }
}

$("navFeedBtn").onclick=()=>switchView('feed');
$("navProfileBtn").onclick=()=>switchView('profile');
$("navSettingsBtn").onclick=()=>switchView('settings');

// Auth Switcher
let authMode="login";
function setAuthMode(mode){
  authMode=mode;
  $("confirmPasswordWrap").classList.toggle("hidden",mode!=="signup");
  $("confirmPassword").required=mode==="signup";
  $("loginBtn").classList.toggle("primary",mode==="login");
  $("loginBtn").classList.toggle("secondary",mode!=="login");
  $("signupBtn").classList.toggle("primary",mode==="signup");
  $("signupBtn").classList.toggle("secondary",mode!=="signup");
  $("signupBtn").textContent=mode==="signup"?tr("createAccountNow"):tr("signup");
  $("loginBtn").textContent=mode==="signup"?tr("switchToLogin"):tr("login");
  status("authStatus","");
}
$("loginBtn").addEventListener("click",()=>{if(authMode!=="login"){setAuthMode("login")}});
$("signupBtn").addEventListener("click",async()=>{
  if(authMode!=="signup"){setAuthMode("signup");return;}
  if(!$("authForm").reportValidity())return;
  if($("password").value!==$("confirmPassword").value){status("authStatus",tr("passwordMismatch"),"error");return;}
  if(!authFns||!auth){status("authStatus",tr("network"),"error");return;}
  $("signupBtn").disabled=true;status("authStatus","…");
  try{await authFns.createUserWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);status("authStatus",tr("account")+" created","ok")}
  catch(err){status("authStatus",err.message,"error")}
  finally{$("signupBtn").disabled=false}
});

$("authForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(authMode!=="login")return;
  if(!authFns||!auth){status("authStatus",tr("network"),"error");return;}
  $("loginBtn").disabled=true;status("authStatus","…");
  try{await authFns.signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}
  catch(err){status("authStatus",err.message,"error")}
  finally{$("loginBtn").disabled=false}
});

setAuthMode("login");
$("logoutBtn").addEventListener("click",()=>authFns&&authFns.signOut(auth));
$("refreshBtn").addEventListener("click",loadFeed);

// Save Profile
$("profileForm").addEventListener("submit",async e=>{
  e.preventDefault();if(!user)return;
  const name=$("displayName").value.trim(),bio=$("profileBio").value.trim();
  if(!name)return status("profileStatus",tr("profileMissing"),"error");
  try{
    await dbFns.setDoc(dbFns.doc(db,"communityProfiles",user.uid),{displayName:name,bio,email:user.email||"",uid:user.uid,updatedAt:dbFns.serverTimestamp()},{merge:true});
    profiles[user.uid]={...(profiles[user.uid]||{}),displayName:name,bio,email:user.email||""};
    updateProfileUI();status("profileStatus",tr("profileSaved"),"ok");
    await loadFeed();
  }catch(err){status("profileStatus",err.message,"error")}
});

// Post Switcher
let postMode="text";
function setPostMode(mode){
  postMode=mode;
  $("bookFields").classList.toggle("hidden",mode!=="book");
  $("textPostMode").classList.toggle("primary",mode==="text");$("textPostMode").classList.toggle("secondary",mode!=="text");
  $("bookPostMode").classList.toggle("primary",mode==="book");$("bookPostMode").classList.toggle("secondary",mode!=="book");
  $("bookName").required=mode==="book";$("bookUrl").required=mode==="book";
  if(mode==="book"){
    $("postTextLabel").textContent = lang==="bn"?"ক্যাপশন বা মন্তব্য (অপশনাল)":"Caption / Comment (Optional)";
  } else {
    $("postTextLabel").textContent = tr("postTextLabel");
  }
}
$("textPostMode").addEventListener("click",()=>setPostMode("text"));
$("bookPostMode").addEventListener("click",()=>setPostMode("book"));

// Publish Post
$("cancelEditBtn").addEventListener("click",()=>resetPostForm());
$("postForm").addEventListener("submit",async e=>{
  e.preventDefault();if(!user)return;
  let text=$("postText").value.trim(),title=$("bookName").value.trim(),description=$("bookDesc").value.trim(),urlRaw=$("bookUrl").value.trim(),url=urlRaw?safeUrl(urlRaw):"";
  if(postMode==="text"){
    title="";description="";url="";
    if(!text)return status("postStatus",lang==="bn"?"পোস্টের লেখা লিখুন।":"Write post content.", "error");
  }else{
    if(urlRaw&&!url)return status("postStatus",tr("badUrl"),"error");
    if(!title||!url)return status("postStatus",lang==="bn"?"বইয়ের নাম ও সঠিক লিংক দিন।":"Enter book name and valid link.","error");
  }
  $("publishBtn").disabled=true;
  try{
    const payload={text,title,description,url,ownerUid:user.uid,ownerEmail:user.email||"",updatedAt:dbFns.serverTimestamp()};
    if(editing){
      await dbFns.updateDoc(dbFns.doc(db,"communityPosts",editing),{text,title,description,url,updatedAt:dbFns.serverTimestamp()});
      status("postStatus",tr("postUpdated"),"ok");
    }else{
      payload.createdAt=dbFns.serverTimestamp();
      await dbFns.addDoc(dbFns.collection(db,"communityPosts"),payload);
      status("postStatus",tr("postSaved"),"ok");
    }
    resetPostForm();await loadFeed();
  }catch(err){status("postStatus",err.message,"error")}finally{$("publishBtn").disabled=false}
});

function resetPostForm(){editing=null;$("postForm").reset();setPostMode("text");$("cancelEditBtn").classList.add("hidden")}

function updateProfileUI(){
  const p=profiles[user.uid]||{};
  const name=p.displayName||user.email?.split("@")[0]||tr("anonymous");
  $("myProfileName").textContent=name;
  $("myProfileEmail").textContent=user.email||"";
  $("displayName").value=p.displayName||"";
  $("profileBio").value=p.bio||"";
}

async function loadFeed(){
  if(!user||!dbFns)return;
  const feed=$("feed");
  feed.replaceChildren(Object.assign(document.createElement("div"),{className:"empty",textContent:tr("loading")}));
  try{
    const profileSnap=await dbFns.getDocs(dbFns.collection(db,"communityProfiles"));
    profiles={};
    profileSnap.forEach(d=>profiles[d.id]=d.data());

    const snap=await dbFns.getDocs(dbFns.query(dbFns.collection(db,"communityPosts"),dbFns.orderBy("createdAt","desc")));
    feed.replaceChildren();
    if(snap.empty){feed.append(Object.assign(document.createElement("div"),{className:"empty",textContent:tr("noPosts")}));return}
    snap.forEach(d=>feed.append(renderPost(d.id,d.data())));
    status("feedStatus","","ok");
  }catch(err){
    feed.replaceChildren(Object.assign(document.createElement("div"),{className:"empty",textContent:tr("network")}));
  }
}

// Render Post Card
function renderPost(id,p){
  const card=document.createElement("article");card.className="post";
  const profile=profiles[p.ownerUid]||{};
  
  // Display Name logic (Fixes email issue)
  const displayName = profile.displayName ? profile.displayName : (p.ownerEmail ? p.ownerEmail.split("@")[0] : tr("anonymous"));
  
  const top=document.createElement("div");top.className="posttop";
  const av=document.createElement("div");av.className="avatar";
  av.innerHTML='<svg class="svg-icon" style="width:24px;height:24px" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
  
  const who=document.createElement("div");who.className="postwho";
  const strong=document.createElement("strong");strong.textContent=displayName;

  if((p.ownerEmail||"").toLowerCase()===ADMIN_EMAIL || (profile.email||"").toLowerCase()===ADMIN_EMAIL){
    const badge=document.createElement("span");badge.className="verified-badge";badge.setAttribute("aria-label","Verified admin");
    badge.innerHTML='<svg viewBox="0 0 24 24"><path fill="#2589ff" d="M12 1.8 14.8 4l3.6-.1 1.2 3.4 3 2-1.2 3.4.5 3.5-3.2 1.7-1.6 3.2-3.5-.6-3.2 1.6-2.5-2.6-3.5-.5-.5-3.5-2.5-2.5 1.6-3.2-.6-3.5 3.2-1.6 1.7-3.2 3.5.5z"/><path d="m7.1 12.2 3.1 3.1 6.8-6.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    strong.append(badge);
  }
  const small=document.createElement("small");small.textContent=tr("created");
  who.append(strong,small);top.append(av,who);card.append(top);

  // Post Caption / Text
  if(p.text){
    const text=document.createElement("p");text.className="post-desc";
    text.textContent=p.text;
    card.append(text);
  }

  // Book Post Section (Title, Description & Link)
  if(p.title && p.url){
    const titleLink=document.createElement("a");titleLink.className="book-title-link";titleLink.href=p.url;titleLink.target="_blank";titleLink.rel="noopener noreferrer";
    const title=document.createElement("strong");title.innerHTML='<svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg> '+p.title;
    const hint=document.createElement("span");hint.className="linkhint";hint.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg><span>'+tr("openLink")+'</span>';
    titleLink.append(title,hint);
    card.append(titleLink);

    // Render Book Description if present
    if(p.description){
      const descBox=document.createElement("div");descBox.className="book-desc-box";
      descBox.textContent=p.description;
      card.append(descBox);
    }
  }

  // Edit / Delete Actions for Author/Admin
  if(user&&(user.uid===p.ownerUid||(user.email||"").toLowerCase()===ADMIN_EMAIL)){
    const actions=document.createElement("div");actions.className="post-actions";
    const edit=document.createElement("button");edit.className="secondary tiny";
    edit.innerHTML='<svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg> '+tr("edit");
    edit.onclick=()=>{$("postText").value=p.text||"";$("bookName").value=p.title||"";$("bookDesc").value=p.description||"";$("bookUrl").value=p.url||"";editing=id;setPostMode(p.url?"book":"text");$("publishBtn").textContent=tr("postUpdated");$("cancelEditBtn").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})};
    
    const del=document.createElement("button");del.className="danger tiny";
    del.innerHTML='<svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg> '+tr("delete");
    del.onclick=async()=>{if(!confirm(tr("confirmDelete")))return;try{await dbFns.deleteDoc(dbFns.doc(db,"communityPosts",id));loadFeed()}catch(err){status("feedStatus",err.message,"error")}};
    actions.append(edit,del);card.append(actions)
  }
  return card;
}

async function start(){
  try{
    const [appFns,aFns,fFns]=await Promise.all([import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")]);
    app=appFns.initializeApp(cfg);authFns=aFns;dbFns=fFns;auth=aFns.getAuth(app);db=fFns.getFirestore(app);
    aFns.onAuthStateChanged(auth,async u=>{
      user=u;
      $("authArea").classList.toggle("hidden",!!u);
      $("communityArea").classList.toggle("hidden",!u);
      if(u){
        const ref=fFns.doc(db,"communityProfiles",u.uid);
        try{
          const d=await fFns.getDoc(ref);
          profiles[u.uid]=d.exists()?d.data():{};
          if(!profiles[u.uid].displayName){
            profiles[u.uid]={displayName:u.email?.split("@")[0]||"Reader",bio:"",email:u.email||""};
          }
          updateProfileUI();
        }catch{}
        await loadFeed();
      }else{resetPostForm();}
    });
  }catch(e){status("authStatus",e?.message||tr("network"),"error");}
}

setPostMode("text");
start();
</script>
