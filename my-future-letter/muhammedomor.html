const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const enc=new TextEncoder(),dec=new TextDecoder();
async function keyFromPassword(p){const k=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(DATA.salt),iterations:DATA.iterations,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);}
async function unlock(){const p=document.getElementById('pw').value;const e=document.getElementById('err');e.textContent='';if(!p){e.textContent='পাসওয়ার্ড দিন।';return}try{const key=await keyFromPassword(p);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ciphertext));document.getElementById('letter').textContent=dec.decode(plain);document.getElementById('lock').style.display='none';document.getElementById('content').style.display='block';document.getElementById('letter').style.display='block';document.getElementById('pw').value='';}catch(x){e.textContent='পাসওয়ার্ড সঠিক নয়। চিঠি খোলা যায়নি।';}}
document.getElementById('content').style.display='none';document.getElementById('unlock').onclick=unlock;document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});document.getElementById('lockBtn').onclick=()=>{document.getElementById('content').style.display='none';document.getElementById('lock').style.display='block';document.getElementById('letter').style.display='none';document.getElementById('letter').textContent='';};
</script></body></html>
