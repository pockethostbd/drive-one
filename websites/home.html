<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030303">
<meta name="description" content="Pipra — a minimal browser home page. Offline interface; internet required to open websites and search.">
<title>Pipra Browser</title>
<style>
:root{color-scheme:dark;--red:#ff1028;--bg:#030303;--text:#f7f7f8;--muted:#aeb0b6;--panel:#202124}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI",Arial,sans-serif}
body{min-height:100svh;overflow-x:hidden}
.page{position:relative;isolation:isolate;min-height:100svh;min-height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#080808 0%,#030303 52%,#000 100%)}
.waves{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

main{position:relative;z-index:1;width:100%;display:flex;align-items:center;flex-direction:column;padding:clamp(100px,25.2vh,235px) 5.2vw 90px}
.brand{display:flex;align-items:center;flex-direction:column;width:100%;margin:0 0 clamp(42px,7.2vh,68px)}
.ant{display:block;width:clamp(145px,30vw,220px);height:clamp(145px,30vw,220px);object-fit:contain}
.search{width:100%;max-width:650px;height:clamp(62px,13.5vw,80px);display:flex;align-items:center;gap:14px;padding:0 10px 0 18px;border-radius:999px;border:1px solid #35363a;background:linear-gradient(115deg,rgba(37,38,41,.96),rgba(27,28,30,.97));box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 7px 24px rgba(0,0,0,.18)}
.google-g{width:30px;height:30px;flex:0 0 30px;object-fit:contain;display:block}
.search input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:#f6f6f7;font-size:clamp(14px,3.7vw,18px);font-family:inherit}
.search input::placeholder{color:#b5b5bb;opacity:1}
.search button{width:54px;height:54px;flex:0 0 54px;border:0;border-radius:50%;background:rgba(255,255,255,.035);color:white;display:grid;place-items:center;cursor:pointer}
.search button svg{width:29px;height:29px}
.shortcuts{width:100%;max-width:650px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:clamp(36px,7.3vh,62px)}
.add-shortcut{grid-column:1/-1;justify-self:center;display:flex;align-items:center;flex-direction:column;gap:13px;min-width:150px;padding:0 12px 10px;border:0;background:transparent;color:#f5f5f7;font:inherit;cursor:pointer}
.plusbox{width:clamp(88px,15vw,114px);height:clamp(88px,15vw,114px);display:grid;place-items:center;border:1.3px solid var(--red);border-radius:29px;background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.008));box-shadow:0 0 12px rgba(255,0,35,.07);transition:transform .18s,border-color .18s}
.plusbox svg{width:40px;height:40px}
.add-label{font-size:16px;font-weight:500}
.add-shortcut:active .plusbox{transform:scale(.96);border-color:#ff6675}
.shortcut{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;color:#eee;text-decoration:none;min-width:0;font-size:12px;overflow-wrap:anywhere}
.shortcut-icon{width:54px;height:54px;border-radius:18px;background:#171719;border:1px solid #333;display:grid;place-items:center;font-size:20px;font-weight:600;color:#fff}
.shortcut-remove{position:absolute;top:-7px;right:calc(50% - 34px);width:22px;height:22px;border-radius:50%;border:1px solid #444;background:#202020;color:white;font-size:15px;display:grid;place-items:center;cursor:pointer}
.dialog-backdrop{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:22px}
.dialog-backdrop.open{display:flex}
.dialog{width:min(100%,360px);border:1px solid #353535;border-radius:22px;background:#151516;padding:22px;box-shadow:0 20px 70px #0009}
.dialog h2{font-size:19px;margin:0 0 18px;font-weight:600}
.dialog label{display:block;font-size:13px;color:#bcbcc2;margin:13px 0 7px}
.dialog input{width:100%;padding:13px 14px;border:1px solid #39393d;border-radius:12px;background:#09090a;color:#fff;font-size:15px;outline:none}
.dialog input:focus{border-color:var(--red)}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.dialog-actions button{padding:10px 16px;border-radius:12px;border:1px solid #444;background:#242426;color:#fff;font-size:14px;cursor:pointer}
.dialog-actions .save{background:var(--red);border-color:var(--red);color:white}
.notice{position:fixed;z-index:6;bottom:22px;left:50%;transform:translateX(-50%);max-width:90vw;padding:11px 16px;border-radius:12px;background:#252527;border:1px solid #424246;color:white;font-size:13px;display:none}
.notice.show{display:block}
@media(max-height:700px){main{padding-top:clamp(45px,10vh,90px)}.brand{margin-bottom:28px}.ant{width:120px;height:120px}.shortcuts{margin-top:28px}}
@media(min-width:700px){main{padding-top:min(20vh,180px)}.brand{margin-bottom:50px}.ant{width:175px;height:175px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(() => {
 const $ = id => document.getElementById(id);
 const form = $('searchForm'), query = $('query'), shortcuts = $('shortcuts');
 const backdrop = $('dialogBackdrop'), shortcutForm = $('shortcutForm');
 const STORAGE_KEY = 'pipra-home-shortcuts-v1';
 let items = [];
 try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); if (Array.isArray(saved)) items = saved.filter(x => x && typeof x.name === 'string' && typeof x.url === 'string').slice(0, 12); } catch (_) {}
 function normalizeUrl(raw) {
   let value = raw.trim();
   if (!value) return '';
   if (/^[a-zA-Z][a-zA-Z\d+.-]*:/.test(value)) {
     try { const u = new URL(value); return ['http:','https:'].includes(u.protocol) ? u.href : ''; } catch (_) { return ''; }
   }
   if (value.includes('.') && !/\s/.test(value)) {
     try { return new URL('https://' + value).href; } catch (_) {}
   }
   return 'https://duckduckgo.com/?q=' + encodeURIComponent(value);
 }
 function go(raw) {
   const url = normalizeUrl(raw);
   if (!url) { showNotice('Please enter a valid website address or search term.'); return; }
   // The home page and its assets are offline; opening websites/search requires internet.
   window.location.href = url;
 }
 form.addEventListener('submit', e => { e.preventDefault(); go(query.value); });
 function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (_) { showNotice('Could not save shortcuts in this browser.'); } }
 function iconText(name) { return (name.trim().charAt(0) || 'W').toUpperCase(); }
 function render() {
   shortcuts.querySelectorAll('.shortcut').forEach(el => el.remove());
   const add = $('addShortcut');
   items.forEach((item, index) => {
     const a = document.createElement('a'); a.className = 'shortcut'; a.href = item.url; a.title = item.name;
     const ico = document.createElement('span'); ico.className = 'shortcut-icon'; ico.textContent = iconText(item.name);
     const label = document.createElement('span'); label.textContent = item.name;
     const remove = document.createElement('button'); remove.className = 'shortcut-remove'; remove.type = 'button'; remove.textContent = '×'; remove.setAttribute('aria-label', 'Remove ' + item.name);
     remove.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); items.splice(index, 1); save(); render(); });
     a.append(ico, label, remove);
     a.addEventListener('click', e => { if (e.target === remove) return; e.preventDefault(); window.location.href = item.url; });
     shortcuts.insertBefore(a, add);
   });
   add.style.display = items.length >= 12 ? 'none' : 'flex';
 }
 function openDialog() { if (items.length >= 12) return; shortcutForm.reset(); backdrop.classList.add('open'); $('siteName').focus(); }
 function closeDialog() { backdrop.classList.remove('open'); $('addShortcut').focus(); }
 $('addShortcut').addEventListener('click', openDialog);
 $('cancelDialog').addEventListener('click', closeDialog);
 backdrop.addEventListener('click', e => { if (e.target === backdrop) closeDialog(); });
 document.addEventListener('keydown', e => { if (e.key === 'Escape' && backdrop.classList.contains('open')) closeDialog(); });
 shortcutForm.addEventListener('submit', e => {
   e.preventDefault();
   const name = $('siteName').value.trim(), url = normalizeUrl($('siteUrl').value);
   if (!name || !url || !/^https?:\/\//i.test(url)) { showNotice('Enter a valid website address.'); return; }
   if (items.length >= 12) { showNotice('You can add up to 12 shortcuts.'); closeDialog(); return; }
   items.push({name, url}); save(); render(); closeDialog();
 });
 let noticeTimer;
 function showNotice(text) { const n = $('notice'); n.textContent = text; n.classList.add('show'); clearTimeout(noticeTimer); noticeTimer = setTimeout(() => n.classList.remove('show'), 2600); }
 render();
})();
</script>
