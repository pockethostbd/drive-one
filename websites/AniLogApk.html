  <style>
    :root {
      color-scheme: dark;
      --bg: #080510;
      --panel: rgba(24, 13, 43, .78);
      --purple: #a855f7;
      --pink: #e879f9;
      --text: #f8f5ff;
      --muted: #b9adc9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 8%, rgba(126, 34, 206, .25), transparent 42%),
        radial-gradient(ellipse at 90% 90%, rgba(147, 51, 234, .13), transparent 35%),
        var(--bg);
    }
    .card {
      width: min(100%, 440px);
      padding: 34px 25px 28px;
      text-align: center;
      border: 1px solid rgba(192, 132, 252, .22);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .42), 0 0 55px rgba(147, 51, 234, .12);
      backdrop-filter: blur(16px);
    }
    .app-icon {
      display: block;
      width: 124px;
      height: 124px;
      object-fit: cover;
      margin: 0 auto 22px;
      border-radius: 27px;
      box-shadow: 0 0 35px rgba(168, 85, 247, .35);
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 9vw, 2.7rem);
      letter-spacing: -.06em;
      font-weight: 800;
    }
    .tagline {
      margin: 10px 0 27px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }
    .download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      padding: 15px 20px;
      border-radius: 16px;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 750;
      background: linear-gradient(110deg, #7c3aed, #c026d3);
      box-shadow: 0 10px 28px rgba(147, 51, 234, .28);
      transition: transform .18s ease, filter .18s ease;
    }
    .download:active { transform: scale(.98); filter: brightness(.94); }
    .download:focus-visible { outline: 3px solid #e9d5ff; outline-offset: 4px; }
    .download svg { width: 21px; height: 21px; flex: 0 0 auto; }
    .note {
      margin: 17px 0 0;
      color: #9588a8;
      font-size: 12px;
      line-height: 1.5;
    }
    footer {
      margin-top: 28px;
      color: #766b86;
      font-size: 12px;
    }
    @media (max-width: 360px) {
      .card { padding: 28px 19px 24px; }
      .app-icon { width: 108px; height: 108px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
